name: Blox Fruits Stock Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "6,16,26,36,46,56 * * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check stock and send Discord alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Save alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- state.json; then
            echo "No state change."
          else
            git add state.json
            git commit -m "Update stock alert state"
            git push
          fi
